name: Coffee House CI
run-name: ${{ github.actor }} triggered Coffee House build (coffee-house-ce) ☕️
on:
  push:
    branches: [coffee-house-ce]
  pull_request:
    branches: [gh-pages]

jobs:
  coffee-house-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: install modules
        run: npm install
      - name: build project
        run: npm run build
      - name: lint code
        run: npm run lint
      - name: prettier
        run: npm run format:check
