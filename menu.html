<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/normalize.css" />
    <link rel="stylesheet" href="/src/css/menu.css" />
    <link rel="icon" href="/favicon.png" type="image/x-icon" />
    <title>Coffee House</title>
  </head>

  <body class="body">
    <header class="header">
      <a class="nav_logo" href="/">
        <img class="logo" src="/icons/logo.svg" alt="Coffee House Logo" />
      </a>
      <div class="burger">
        <div class="line"></div>
        <div class="line"></div>
      </div>
      <nav class="nav">
        <ul class="nav_list">
          <li>
            <a href="/#favorite" class="link nav_link burger_link" data-i18n="header.nav.favorite"></a>
          </li>
          <li><a href="/#about" class="link nav_link burger_link" data-i18n="header.nav.about"></a></li>
          <li><a href="/#app" class="link nav_link burger_link" data-i18n="header.nav.app"></a></li>
          <li><a href="#footer" class="link nav_link burger_link" data-i18n="header.nav.contact"></a></li>
        </ul>
        <div class="lang-switcher">
          <button data-lang="ru" class="lang-btn">RU</button>
          <span class="lang-separator"></span>
          <button data-lang="en" class="lang-btn">EN</button>
        </div>
        <a class="link nav_cart"></a>
        <a class="nav_menu burger_link" aria-current="page">
          <span class="text" data-i18n="header.menu"></span>
          <img src="/icons/icon-coffee-cup.svg" alt="icon-coffee-cup" />
        </a>
      </nav>
    </header>
    <main class="main">
      <section id="menu" class="menu">
        <h2 class="subtitle" data-i18n="menu.subtitle"></h2>
        <div class="menu__switchers__wrapper"></div>
        <div class="menu__cards__wrapper"></div>
      </section>
    </main>
    <footer id="footer" class="footer"></footer>
    <script type="module" src="/src/ui/script.ts" defer></script>
  </body>
</html>
